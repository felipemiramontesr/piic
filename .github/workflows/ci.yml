name: CI/CD Strategy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    name: 🔍 Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

  build-and-deploy:
    name: 🚀 Build & Deploy
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 🖼️ Optimize Images
        uses: calibreapp/image-actions@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true

      - name: Build project
        run: npm run build

      - name: Verify Build
        run: |
          if [ ! -f dist/index.html ]; then echo "Build failed: index.html missing"; exit 1; fi
          if [ ! -d dist/assets ]; then echo "Build failed: assets directory missing"; exit 1; fi

      - name: 📂 Sync to Production (LFTP)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set ftp:ssl-allow no; \
                  open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}; \
                  mirror -R ./dist/ ./; \
                  quit"
